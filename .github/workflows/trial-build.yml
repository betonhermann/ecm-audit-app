name: "Testversion bauen (Windows)"
on:
  workflow_dispatch:
    inputs:
      tage:
        description: "Laufzeit ab erstem Start in Tagen"
        default: "7"
        required: true
      spaetestens:
        description: "Spätestes Ende in Tagen ab heute (gegen Neuinstallation)"
        default: "21"
        required: true
      kontakt:
        description: "Kontakt im Sperrbildschirm"
        default: "Jochen Deiß, deiss-it.de"
        required: true

jobs:
  trial:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Laufzeit festlegen
        shell: bash
        run: |
          echo "ECM_TRIAL_DAYS=${{ inputs.tage }}" >> "$GITHUB_ENV"
          echo "ECM_TRIAL_CAP=$(( $(date +%s) + ${{ inputs.spaetestens }} * 86400 ))" >> "$GITHUB_ENV"
          echo "ECM_TRIAL_CONTACT=${{ inputs.kontakt }}" >> "$GITHUB_ENV"
          echo "ABLAUF=$(date -d "+${{ inputs.spaetestens }} days" +%Y-%m-%d)" >> "$GITHUB_ENV"
      - run: npm install
      - name: App bauen
        run: npx tauri build --bundles nsis
      - name: Installer umbenennen
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          for f in *.exe; do mv "$f" "Testversion_${f// /_}"; done
          ls
      - uses: actions/upload-artifact@v4
        with:
          name: ECM-Audit-Testversion-bis-spaetestens-${{ env.ABLAUF }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECM Audit</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">ECM</span>
        <span class="brand-name">Audit</span>
      </div>
      <button id="btn-liste" class="nav-btn nav-liste">Alle Audits</button>
      <div id="audit-head" class="audit-head"></div>
      <nav id="nav" class="nav" aria-label="Audit"></nav>
      <div class="sidebar-foot">
        <div id="save-status" class="save-status" aria-live="polite"></div>
        <div class="version">Version 6.7.0</div>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="print-root" class="print-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <script src="js/catalog.js"></script>
  <script src="js/store.js"></script>
  <script src="js/model.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
